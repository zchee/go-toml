name: toml-test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  toml-test:
    name: toml-test/${{ matrix.runner }}${{ matrix.goexperiment && '/' || '' }}${{ matrix.goexperiment }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            goexperiment: ""
          - runner: ubuntu-26.04
            goexperiment: "simd"
          - runner: ubuntu-26.04-arm
            goexperiment: ""
          - runner: ubuntu-26.04-arm
            goexperiment: "simd"

    permissions:
      contents: read

    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cloudx-io/setup-go@v1
        with:
          go-version: 1.27.x
          cache-key-prefix: test

      - name: Build toml-test adapters
        run: |
          go version
          mkdir -p bin
          go build -o ./bin/toml-test-decoder ./internal/cmd/toml-test-decoder
          go build -o ./bin/toml-test-encoder ./internal/cmd/toml-test-encoder

      - name: Run TOML 1.1 implementation testsuite
        env:
          NO_COLOR: "1"
        run: |-
          go tool toml-test test \
            -v \
            -toml 1.1 \
            -decoder=./bin/toml-test-decoder \
            -encoder=./bin/toml-test-encoder

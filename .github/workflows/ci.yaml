name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# concurrency:
#   group: ${{ github.workflow }}-${{ github.ref }}
#   cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test/${{ matrix.runner }}${{ matrix.goexperiment && '/' || '' }}${{ matrix.goexperiment }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            goexperiment: ""
          - runner: ubuntu-26.04
            goexperiment: "simd"
          - runner: ubuntu-26.04-arm
            goexperiment: ""
          - runner: ubuntu-26.04-arm
            goexperiment: "simd"
          - runner: xcode-27
            goexperiment: ""
          - runner: xcode-27
            goexperiment: "simd"

    permissions:
      contents: read

    env:
      GOEXPERIMENT: ${{ matrix.goexperiment }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: cloudx-io/setup-go@v1
        with:
          go-version: 1.27.x
          cache-key-prefix: test

      - name: Vet
        run: |
          go version
          go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with race detector
        run: |-
          go test -race -count=1 -shuffle=on ./...
